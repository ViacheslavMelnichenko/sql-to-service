# The LIVE eval (Phase 4, B.3/B.4). This is the ONE workflow that spends model
# budget, so it is manual-only (`workflow_dispatch`) — never on push. It produces
# the genuine evals/results/run-001.json: a real headless agent, driven through the
# four-stage pipeline, gated by the same deterministic gate CI already runs for free.
#
# Why it exists as CI at all: the pre-registration (evals/PREREGISTRATION.md) forbids
# a retrofitted or hand-composed number. A result produced by an authenticated,
# logged CI job — not typed on a laptop — is the honest way to get run-001. The
# artifact it uploads is the thing that later replaces the demo's illustrative table.
#
# Auth, the part that is not free: the `claude` CLI here is fronted by a gateway
# whose azureADTokenProvider uses a ChainedTokenCredential. A headless `claude -p`
# inherits no interactive `az login`, so it authenticates as a service principal via
# EnvironmentCredential (AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_CLIENT_SECRET).
# Those three are pulled at job time from Infisical (docs/SECURITY.md §"Secret
# handling") — never committed, never on disk, never in argv. The only GitHub-native
# secrets are the Infisical machine-identity credentials that unlock the rest.
name: eval-live

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Result file stem (evals/results/<run_id>.json)'
        required: false
        default: 'run-001'
      procs:
        description: 'Optional space-separated proc override (blank = the pre-registered default set)'
        required: false
        default: ''

# Read-only against the repo: this job measures, it does not write back. The result
# is an uploaded artifact a human reviews and commits, not a bot push.
permissions:
  contents: read

concurrency:
  group: eval-live
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    env:
      PYTHON: python3
      MONGO_URI: mongodb://localhost:37017/wwi
      # Pin the CLI model alias the harness passes to `--model`. 'opus' is a valid
      # alias; the internal gateway id is NOT and every attempt would fail with zero
      # tokens. The exact dated snapshot is captured from the first live invocation.
      EVAL_MODEL: opus
    steps:
      - uses: actions/checkout@v4

      - name: Write .env for docker-compose
        run: |
          # Throwaway dev-engine password, runner-only, torn down with the job.
          cat > .env <<'ENV'
          MSSQL_SA_PASSWORD=Sql2Service!ci
          MSSQL_HOST_PORT=11433
          MONGO_HOST_PORT=37017
          ENV

      - name: Bring up SQL Server + Mongo
        run: docker compose up -d mssql mongo

      - name: Wait for both engines healthy
        run: |
          deadline=$((SECONDS + 240))
          for svc in mssql mongo; do
            until [ "$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q $svc)" 2>/dev/null)" = "healthy" ]; do
              [ $SECONDS -lt $deadline ] || { echo "::error::$svc never became healthy"; docker compose logs $svc | tail -50; exit 1; }
              sleep 5
            done
            echo "$svc healthy"
          done

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pymongo (seed loader)
        run: python3 -m pip install --quiet pymongo

      - name: Install the Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      # Pull the Azure service principal (and anything else the gateway needs) from
      # Infisical into this step's environment. The action exports each secret as an
      # env var for SUBSEQUENT steps; nothing is written to disk. The Infisical
      # machine-identity credentials are the only GitHub-native secrets — configure
      # them in Settings → Secrets and variables → Actions.
      - name: Fetch model-access secrets from Infisical
        uses: Infisical/secrets-action@v1.0.9
        with:
          method: 'universal-auth'
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: 'prod'
          secret-path: '/claude-gateway'

      - name: Sanity-check headless auth before spending budget
        run: |
          # A one-shot probe: if the service principal cannot mint a token, fail HERE
          # with a clear message rather than burning three attempts per proc on an
          # api_error. `--model "$EVAL_MODEL"` must be a valid alias (see env above).
          set -e
          [ -n "$AZURE_CLIENT_ID" ]     || { echo "::error::AZURE_CLIENT_ID not set — Infisical fetch or secret-path is wrong"; exit 1; }
          [ -n "$AZURE_TENANT_ID" ]     || { echo "::error::AZURE_TENANT_ID not set"; exit 1; }
          [ -n "$AZURE_CLIENT_SECRET" ] || { echo "::error::AZURE_CLIENT_SECRET not set"; exit 1; }
          out="$(claude -p --output-format json --model "$EVAL_MODEL" 'Reply with the single word: ok' 2>&1 || true)"
          echo "$out" | head -20
          echo "$out" | grep -q '"is_error": *true' && { echo "::error::headless auth probe failed — the SP cannot reach the gateway"; exit 1; }
          echo "auth probe ok"

      - name: Live eval — drive the real agent, gate every proc
        env:
          EVAL_LIVE_OK: '1'
        run: |
          extra=""
          if [ -n "${{ github.event.inputs.procs }}" ]; then
            extra="--procs ${{ github.event.inputs.procs }}"
          fi
          python3 evals/harness.py --run-id "${{ github.event.inputs.run_id }}" $extra

      - name: Upload the eval result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-${{ github.event.inputs.run_id }}
          path: evals/results/${{ github.event.inputs.run_id }}.json
          if-no-files-found: error

      - name: Tear down
        if: always()
        run: docker compose down -v
